; DisCraft: Dishonored with Minecraft physics, inventory, blocks and combat.
; Goes in Dishonored\Binaries\Win32\ next to DisCraft.asi.
; Log: %LOCALAPPDATA%\DisCraft\DisCraft.log

[Minecraft]
; Start Minecraft when Dishonored starts. It stays hidden, opens its DisCraft world by itself once
; you're in a level, and quits when Dishonored closes. 0 = start Minecraft yourself.
bStartWithGame = 1

; Empty: the Minecraft bundled with DisCraft (DisCraft\DisCraft-Minecraft.zip next to the plugin: a
; portable Prism Launcher, unpacked to %LOCALAPPDATA%\DisCraft; the first time it asks you to sign
; in with your Microsoft account), or an installed Prism Launcher.
; Or the full path of your own launcher (Prism, MultiMC, or a .bat file).
sLauncher =

; What to pass to the launcher. For Prism: --launch and the DisCraft instance's folder name.
sArguments = --launch DisCraft

[Controls]
; Keys Dishonored keeps while Minecraft has the controls (its menu, journal, quickload...).
; Every other key goes to Minecraft (E inventory, T chat, F5 camera, ...).
sGameKeys = Escape, Tab, F9
; Uses what you look at in Dishonored (doors, pickups, talking): calls the player controller's
; script function below.
sActivateKey = G
sActivateFunction = Use
; Minecraft's pause / options menu (Esc is Dishonored's).
sMinecraftMenuKey = O
; Hand the controls back to Dishonored (and back again): powers, cutscenes, anything DisCraft
; doesn't cover.
sToggleKey = F11
; Cycle how Minecraft's blocks are hidden behind Dishonored's walls (see [Render] iDepthMode).
sDepthModeKey = F10

[World]
; Unreal units per Minecraft block. 0 = automatic: the player's collision cylinder is 1.8 blocks.
fUnitsPerBlock = 0
; How far around the player Dishonored's world is traced into Minecraft collision, and how much
; time per frame that may take (more while Minecraft waits for the ground under it).
fTraceRadiusBlocks = 24
fTraceBudgetMs = 4
fTraceBudgetUrgentMs = 20
; Size of the traced grid near the player and farther out (blocks).
fFineCell = 0.25
fCoarseCell = 0.5

[Combat]
; Minecraft damage -> Dishonored damage (a diamond sword's 7 becomes 56).
fDamageToGame = 8
; Dishonored damage -> Minecraft (Minecraft divides by 5 again: a 20-damage hit = 2 hearts).
fDamageFromGame = 1
fExplosionDamage = 60
fKnockback = 400
; Damage types for Minecraft's hits (class names, e.g. DamageType or MyPackage.MyDamageType).
; Empty: picked by name from the game's damage types (the log lists them).
sDamageTypeMelee =
sDamageTypeProjectile =
sDamageTypeExplosion =
; Cancel the game's script TakeDamage on the player and forward it to Minecraft (attacker and
; kind included). Damage that still gets through is forwarded from the player's health either way.
bHookTakeDamage = 1

[Render]
; Draw Minecraft's blocks, items and mobs in Dishonored's frame.
bDrawBlocks = 1
; 0: blocks are drawn over Dishonored (they only hide behind each other)
; 1: they hide behind Dishonored's walls (the game's depth buffer, normal Z)
; 2: the same with reversed Z. F10 cycles through them in game.
iDepthMode = 1
; Dishonored's near clipping plane in Unreal units (must match for 1/2 to line up).
fNearClipUU = 10
; 0: the camera FOV is horizontal (Unreal Engine 3), 1: vertical.
iFovMode = 0
bInvertRoll = 0
fBlockBrightness = 1.0

; While Minecraft drives the player: hide the game's own body, hands, weapons (1) and its HUD (1).
bHideGamePlayer = 1
bHideGameHud = 1

[Engine]
; Everything is found at runtime; these are overrides for when the log says something wasn't.
; Function called every frame on the player controller: the first of these the game has is used.
sTickFunction = PlayerTick,PlayerMove,Tick
; UObject::ProcessEvent's vtable slot (0 = automatic).
iProcessEventIndex = 0
; Calling native functions (SetLocation, Trace, ...) through ProcessEvent: 0 as is, 1 with
; FUNC_Native set, 2 with it cleared during the call. Only change if the log shows calls failing.
iNativeCallMode = 0
; GNames / GObjects as offsets into Dishonored.exe (0 = automatic), and any UE3 layout offset
; (iLayoutName, iLayoutClass, iLayoutOuter, iLayoutFunc, ...; 0 = automatic).
iGNamesRva = 0
iGObjectsRva = 0

[Debug]
; Detailed per-frame logs in DisCraft.log (combat, collision regions, activation). 0 = off.
bDiagnostics = 0
; Log crashes (where, what DisCraft was doing, the code on the stack) before the game's own crash
; handler runs. Only logs; 0 = off.
bCrashLog = 1
